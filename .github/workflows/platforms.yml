name: Platform checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Unit tests and native credential storage
        run: python -m unittest discover -s tests -v
      - name: Check shell entrypoints
        if: runner.os == 'macOS'
        run: |
          for script in setup.sh setup.command 启动听桥.command; do bash -n "$script"; done
      - name: Backend and ASR dependency smoke check
        run: python scripts/smoke_test.py
      - name: Transcribe upstream public sample on macOS
        if: runner.os == 'macOS'
        run: |
          python scripts/download_model.py
          python scripts/smoke_test.py --asr
